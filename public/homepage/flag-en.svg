<svg width="20" height="15" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- UK Union Jack flag, 20×15 — replaces 🌐 globe placeholder in SiteHeader -->
  <rect width="20" height="15" fill="#012169"/>
  <!-- White diagonals (Saint Andrew + Saint Patrick base) -->
  <path d="M0 0 L20 15 M20 0 L0 15" stroke="white" stroke-width="3"/>
  <!-- Red diagonals (Saint Patrick cross) -->
  <path d="M0 0 L20 15 M20 0 L0 15" stroke="#C8102E" stroke-width="1.5"/>
  <!-- White cross (Saint George base) -->
  <rect x="8" y="0" width="4" height="15" fill="white"/>
  <rect x="0" y="5.5" width="20" height="4" fill="white"/>
  <!-- Red cross (Saint George) -->
  <rect x="8.75" y="0" width="2.5" height="15" fill="#C8102E"/>
  <rect x="0" y="6.25" width="20" height="2.5" fill="#C8102E"/>
</svg>
